[workspace]
resolver = "2"
members = [
    "generator",
    "core/line_channel_access_token",
    "core/line_insight",
    "core/lib/",
    "core/line_liff",
    "core/line_manage_audience",
    "core/line_messaging_api",
    "core/line_module",
    "core/line_module_attach",
    "core/line_shop",
    "core/line_webhook",
]

[workspace.dependencies]
serde = { version = "^1.0", features = ["derive"] }
serde_json = "^1.0"
serde_repr = "^0.1"
serde_with = { version = "^3.8", default-features = false, features = ["base64", "std", "macros"] }
url = "^2.5"
uuid = { version = "^1.8", features = ["serde", "v4"] }
hyper = { version = "^1.3.1", features = ["full"] }
hyper-util = { version = "0.1.5", features = ["client", "client-legacy", "http1", "http2"] }
hyper-rustls = { version = "0.27", features = ["native-tokio", "http1", "http2"] }
http-body-util = "0.1.2"
base64 = "0.22.1"
futures = "^0.3"
hmac = "0.12.1"
sha2 = "0.10.8"
