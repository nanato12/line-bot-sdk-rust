[workspace]
resolver = "2"
members = [
    "core/lib/",
]

[workspace.dependencies]
serde = "^1.0"
serde_json = "^1.0"
serde_repr = "^0.1"
url = "^2.5"
uuid = "^1.22"
hyper = "^1.8"
hyper-util = "0.1.20"
hyper-rustls = "0.27.7"
http-body-util = "0.1.3"
base64 = "0.22.1"
hmac = "0.12.1"
sha2 = "0.10.8"
tokio = "^1.50"

# Lints for generated code
[workspace.lints.clippy]
derivable_impls = "allow"
empty_docs = "allow"
large_enum_variant = "allow"
