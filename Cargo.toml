[workspace]
resolver = "2"
members = [
    "generator",
    "core/line_channel_access_token",
    "core/line_insight",
    "core/lib/",
    "core/line_liff",
    "core/line_manage_audience",
    "core/line_messaging_api",
    "core/line_module",
    "core/line_module_attach",
    "core/line_shop",
    "core/line_webhook",
]

[workspace.dependencies]
serde = "^1.0"
serde_json = "^1.0"
serde_repr = "^0.1"
serde_with = "^3.8"
url = "^2.5"
uuid = "^1.8"
hyper = "^1.3.1"
hyper-util = "0.1.5"
hyper-rustls = "0.27"
http-body-util = "0.1.2"
base64 = "0.22.1"
futures = "^0.3"
hmac = "0.12.1"
sha2 = "0.10.8"
tokio = "^1"

# Lints for generated code — these patterns come from OpenAPI Generator
# and will be addressed by improving the generator templates.
[workspace.lints.rust]
unreachable_code = "allow"

[workspace.lints.clippy]
multiple_bound_locations = "allow"
derivable_impls = "allow"
empty_default_trait_impl = "allow"
unused_mut = "allow"
empty_docs = "allow"
len_zero = "allow"
only_used_in_recursion = "allow"
redundant_closure = "allow"
diverging_sub_expression = "allow"
unnecessary_map_or = "allow"
