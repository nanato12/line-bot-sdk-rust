[package]
name = "line-bot-sdk-rust"
version = "1.1.0"
authors = ["nanato12 <admin@okj.info>"]
edition = "2021"
rust-version = "1.75.0"
description = "LINE Messaging API SDK for Rust"
readme = "../../README.md"
repository = "https://github.com/nanato12/line-bot-sdk-rust/"
homepage = "https://github.com/nanato12/line-bot-sdk-rust/"
documentation = "https://docs.rs/line-bot-sdk-rust"
license = "Apache-2.0"
keywords = ["line", "linebot", "line-bot-sdk", "line-messaging-api"]
categories = ["api-bindings"]
exclude = ["tests/", "examples/"]

[features]
default = []
rocket_support = ["rocket"]
actix_support = ["actix-web"]
axum_support = ["axum"]

[dependencies]
base64.workspace = true
hmac.workspace = true
sha2.workspace = true
hyper = { workspace = true, features = ["full"] }
hyper-util = { workspace = true, features = ["client", "client-legacy", "http1", "http2"] }
hyper-rustls = { workspace = true, features = ["native-tokio", "http1", "http2"] }

[dependencies.rocket]
version = "0.5.1"
optional = true
default-features = false

[dependencies.actix-web]
version = "4.13.0"
optional = true
default-features = false

[dependencies.axum]
version = "0.8"
optional = true
default-features = false

[dependencies.line_channel_access_token]
version = "0.0.2"
path = "../line_channel_access_token"

[dependencies.line_insight]
version = "0.0.2"
path = "../line_insight"

[dependencies.line_liff]
version = "1.1.0"
path = "../line_liff"

[dependencies.line_manage_audience]
version = "0.0.2"
path = "../line_manage_audience"

[dependencies.line_messaging_api]
version = "0.0.4"
path = "../line_messaging_api"

[dependencies.line_module]
version = "0.0.2"
path = "../line_module"

[dependencies.line_module_attach]
version = "0.0.2"
path = "../line_module_attach"

[dependencies.line_shop]
version = "0.0.1"
path = "../line_shop"

[dependencies.line_webhook]
version = "1.0.2"
path = "../line_webhook"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }

[lints]
workspace = true
