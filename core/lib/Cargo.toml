[package]
name = "line-bot-sdk-rust"
version = "3.0.0"
authors = ["nanato12 <admin@okj.info>"]
edition = "2021"
rust-version = "1.75.0"
description = "LINE Messaging API SDK for Rust"
readme = "../../README.md"
repository = "https://github.com/nanato12/line-bot-sdk-rust/"
homepage = "https://github.com/nanato12/line-bot-sdk-rust/"
documentation = "https://docs.rs/line-bot-sdk-rust"
license = "Apache-2.0"
keywords = ["line", "linebot", "line-bot-sdk", "line-messaging-api"]
categories = ["api-bindings"]
exclude = ["tests/", "examples/"]

[features]
default = []
rocket_support = ["rocket"]
actix_support = ["actix-web"]
axum_support = ["axum"]

[dependencies]
base64.workspace = true
hmac.workspace = true
sha2.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
serde_repr.workspace = true
url.workspace = true
uuid = { workspace = true, features = ["serde", "v4"] }
hyper = { workspace = true, features = ["full"] }
hyper-util = { workspace = true, features = ["client", "client-legacy", "http1", "http2"] }
hyper-rustls = { workspace = true, features = ["native-tokio", "http1", "http2"] }
http-body-util.workspace = true
tokio = { workspace = true, features = ["time"] }

[dependencies.rocket]
version = "0.5.1"
optional = true
default-features = false

[dependencies.actix-web]
version = "4.13.0"
optional = true
default-features = false

[dependencies.axum]
version = "0.8"
optional = true
default-features = false

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }

[lints]
workspace = true
